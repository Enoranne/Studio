[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piste-studio"
version = "0.29.1"
description = "Local AI filmmaking workspace with canon, locks, versioned edits, transcript intelligence, editorial agent, Tesseract bridge and an integrated local web UI."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
piste-studio = "piste_studio.cli:main"
piste-studio-app = "piste_studio.app:main"

[tool.setuptools.packages.find]
include = ["piste_studio*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.48"]
vision = ["transformers>=4.40", "torch>=2.2", "Pillow>=10"]
packaging = ["pyinstaller>=6.22,<7"]

[tool.setuptools.package-data]
piste_studio = ["ui/*"]
