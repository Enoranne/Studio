[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piste-studio"
version = "0.0.11"
description = "Local AI filmmaking workspace with canon, locks, versioned edits, Tesseract bridge and an integrated local web UI with timeline publishing and Tesseract authoring."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
piste-studio = "piste_studio.cli:main"
piste-studio-app = "piste_studio.app:main"

[tool.setuptools.packages.find]
include = ["piste_studio*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.package-data]
piste_studio = ["ui/*"]
