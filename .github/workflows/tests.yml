name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Check UI JavaScript syntax
        run: find piste_studio/ui -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: pytest -q
