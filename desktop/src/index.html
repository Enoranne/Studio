<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PISTE Studio</title>
  <link rel="stylesheet" href="./launcher.css">
</head>
<body>
  <main class="launcher">
    <section class="hero">
      <div class="mark"><span></span></div>
      <p class="eyebrow">PISTE STUDIO · DESKTOP</p>
      <h1>Ouvrir un projet</h1>
      <p class="intro">Choisis le dossier d’un projet PISTE Studio. Le moteur local démarre automatiquement, sans Terminal.</p>
      <button id="openProject" class="primary">Choisir un projet…</button>
      <p id="status" class="status">Prêt.</p>
    </section>
    <section class="notes">
      <div><b>LOCAL</b><span>Les médias restent sur cette machine.</span></div>
      <div><b>MASTER</b><span>Le master protégé n’est jamais modifié.</span></div>
      <div><b>TESSERACT</b><span>Le moteur Tesseract reste installé séparément.</span></div>
    </section>
  </main>
  <script src="./launcher.js"></script>
</body>
</html>
